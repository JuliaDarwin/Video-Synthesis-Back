spring.profiles.include=local
spring.application.name=tfmBack
server.port=${PORT:8080}

# MongoDB Configuration (Spring Boot 4 uses spring.mongodb.*)
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:${SPRING_MONGODB_URI:${MONGODB_URI:${MONGO_URI:${MONGODB_URL:${DATABASE_URL:mongodb://localhost:27017/portfolio}}}}}}
spring.mongodb.database=${MONGODB_DATABASE:portfolio}
spring.data.mongodb.uri=${spring.mongodb.uri}
spring.data.mongodb.database=${spring.mongodb.database}

# Resend Configuration
resend.api-key=${RESEND_API_KEY}
resend.send-to=juliaelguetaserra@gmail.com
# Use onboarding@resend.dev if you haven't verified a domain yet
resend.send-from=My App Contact <onboarding@resend.dev>

# Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=70000

# Cloudinary Configuration
cloudinary.url=${CLOUDINARY_URL}